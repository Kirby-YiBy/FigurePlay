<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>FigurePlay E2E Smoke Harness</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0; }
  header { padding: 18px 24px; background: #1e293b; border-bottom: 3px solid #3b82f6; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: #94a3b8; font-size: 13px; }
  main { padding: 20px 24px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  section { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px 16px; }
  h2 { margin: 0 0 10px; font-size: 15px; color: #93c5fd; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer; margin: 0 8px 8px 0; }
  button:hover { background: #1d4ed8; }
  input[type=file] { display: block; margin: 6px 0 10px; color: #cbd5e1; font-size: 13px; }
  pre { background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 10px; font-size: 12px; line-height: 1.45; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  .ok { color: #4ade80; }
  .bad { color: #f87171; }
  .warn { color: #fbbf24; }
  #drop-zone { border: 2px dashed #475569; border-radius: 10px; padding: 24px; text-align: center; color: #94a3b8; margin: 10px 0; }
  #drop-zone.hover { border-color: #3b82f6; color: #93c5fd; background: #172033; }
  #status { padding: 10px 24px; font-size: 13px; color: #94a3b8; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td, th { border: 1px solid #334155; padding: 5px 8px; text-align: left; }
  th { background: #172033; color: #93c5fd; }
</style>
</head>
<body>
<header>
  <h1>FigurePlay E2E Smoke Harness</h1>
  <div class="sub">file:// 页面中验证：setInputFiles → FileReader → 图片解码 → canvas 取样 → 下载；以及 IndexedDB / localStorage / fetch / 相对路径图片</div>
</header>
<div id="status">等待测试脚本调用 window.smoke.* ...</div>
<main>
  <section>
    <h2>1) 文件注入与读取（setInputFiles → FileReader）</h2>
    <input id="file-input" type="file" accept="image/*,.svg,.pdf" multiple />
    <div id="drop-zone">拖放区域（可选测试用）</div>
    <button id="btn-process">处理当前 input.files</button>
    <button id="btn-clear">清空结果</button>
    <pre id="file-result">（尚未处理文件）</pre>
  </section>
  <section>
    <h2>2) 下载（acceptDownloads）</h2>
    <button id="btn-download-png">下载 canvas PNG</button>
    <button id="btn-download-text">下载文本</button>
    <pre id="download-result">（尚未触发下载）</pre>
  </section>
  <section>
    <h2>3) 存储与网络能力</h2>
    <button id="btn-idb">测试 IndexedDB</button>
    <button id="btn-storage">测试 localStorage</button>
    <button id="btn-fetch">测试 fetch(file://)</button>
    <button id="btn-image">测试相对路径图片 + canvas</button>
    <pre id="capability-result">（尚未测试）</pre>
  </section>
  <section>
    <h2>4) 环境信息</h2>
    <pre id="env-info"></pre>
  </section>
</main>
<script>
"use strict";

const state = { latestProcessed: null };

function $(sel) { return document.querySelector(sel); }

function stringify(value) {
  try { return JSON.stringify(value, null, 2); } catch (err) { return String(value); }
}

function show(sel, value, ok) {
  const el = $(sel);
  el.textContent = typeof value === "string" ? value : stringify(value);
  el.className = ok === true ? "ok" : ok === false ? "bad" : "";
}

function setStatus(text, ok) {
  const el = $("#status");
  el.textContent = text;
  el.className = ok === true ? "ok" : ok === false ? "bad" : "";
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error("FileReader error"));
    reader.onabort = () => reject(new Error("FileReader abort"));
    reader.readAsDataURL(file);
  });
}

function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error("FileReader error"));
    reader.readAsText(file);
  });
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = (event) => reject(new Error("Image decode failed: " + String(event && event.type)));
    img.src = src;
  });
}

async function processOneFile(file) {
  const result = {
    name: file.name,
    size: file.size,
    type: file.type || "(empty)",
    lastModified: file.lastModified,
  };
  try {
    const dataUrl = await readFileAsDataURL(file);
    result.dataUrlPrefix = String(dataUrl).slice(0, 48);
    result.dataUrlLength = dataUrl.length;
    const img = await loadImage(dataUrl);
    result.decoded = true;
    result.naturalWidth = img.naturalWidth;
    result.naturalHeight = img.naturalHeight;
    // data URL 图片不污染 canvas，可读像素（应用导出/缩放依赖此假设）
    const canvas = document.createElement("canvas");
    canvas.width = Math.min(img.naturalWidth, 16) || 16;
    canvas.height = Math.min(img.naturalHeight, 16) || 16;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const pixel = Array.from(ctx.getImageData(0, 0, 1, 1).data);
    result.canvasReadable = true;
    result.canvasFirstPixel = pixel;
    result.exportDataUrlOk = canvas.toDataURL("image/png").startsWith("data:image/png");
  } catch (err) {
    result.decoded = false;
    result.error = String((err && err.name) || "") + ": " + String((err && err.message) || err);
  }
  try {
    const buffer = await file.arrayBuffer();
    result.arrayBufferBytes = buffer.byteLength;
  } catch (err) {
    result.arrayBufferError = String(err && err.message || err);
  }
  try {
    const text = file.size <= 4096 ? (await readFileAsText(file)).slice(0, 120) : "(skip, too large)";
    result.textPreview = text;
  } catch (err) {
    result.textReadError = String(err && err.message || err);
  }
  return result;
}

async function processInputFiles() {
  const input = $("#file-input");
  const files = Array.from(input.files || []);
  if (files.length === 0) {
    state.latestProcessed = { count: 0, files: [], error: "input.files 为空" };
    show("#file-result", state.latestProcessed, false);
    return state.latestProcessed;
  }
  const results = [];
  for (const file of files) results.push(await processOneFile(file));
  state.latestProcessed = { count: files.length, files: results };
  const allOk = results.every((r) => r.decoded);
  show("#file-result", state.latestProcessed, allOk);
  setStatus("已处理 " + results.length + " 个文件，解码成功 " + results.filter((r) => r.decoded).length, allOk);
  return state.latestProcessed;
}

async function downloadPng(name, text) {
  const canvas = document.createElement("canvas");
  canvas.width = 640;
  canvas.height = 360;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, 640, 360);
  grad.addColorStop(0, "#d94a38");
  grad.addColorStop(0.5, "#2f6fd0");
  grad.addColorStop(1, "#2e9e5b");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 640, 360);
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, 640, 72);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 44px Arial";
  ctx.fillText("FigurePlay E2E", 28, 54);
  ctx.font = "bold 30px Arial";
  ctx.fillText(text || "download smoke 640x360", 28, 200);
  ctx.strokeStyle = "#ffd666";
  ctx.lineWidth = 10;
  ctx.strokeRect(20, 20, 600, 320);
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = name || "figureplay-smoke.png";
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  const info = {
    triggered: true,
    filename: anchor.download,
    blobType: blob.type,
    blobBytes: blob.size,
    canvasToBlobOk: true,
  };
  show("#download-result", info, true);
  return info;
}

async function downloadText(name, content) {
  const text = content == null ? "FigurePlay E2E 下载测试\ntimestamp=" + Date.now() + "\n" : content;
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = name || "figureplay-smoke.txt";
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  const info = { triggered: true, filename: anchor.download, blobType: blob.type, blobBytes: blob.size };
  show("#download-result", info, true);
  return info;
}

async function testIndexedDB() {
  const out = { apiPresent: typeof indexedDB !== "undefined" && indexedDB !== null };
  if (!out.apiPresent) { show("#capability-result", out, false); return out; }
  let db = null;
  try {
    db = await new Promise((resolve, reject) => {
      const request = indexedDB.open("figureplay-smoke", 1);
      request.onupgradeneeded = () => {
        const opened = request.result;
        if (!opened.objectStoreNames.contains("kv")) opened.createObjectStore("kv");
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("indexedDB.open onerror"));
      request.onblocked = () => reject(new Error("indexedDB.open blocked"));
    });
    out.openOk = true;
    out.version = db.version;
    out.stores = Array.from(db.objectStoreNames);
    const payload = { key: "smoke", value: "hello-" + Date.now(), at: new Date().toISOString() };
    await new Promise((resolve, reject) => {
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(payload, "smoke");
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error("put tx error"));
      tx.onabort = () => reject(tx.error || new Error("put tx abort"));
    });
    out.putOk = true;
    const readBack = await new Promise((resolve, reject) => {
      const tx = db.transaction("kv", "readonly");
      const request = tx.objectStore("kv").get("smoke");
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("get request error"));
    });
    out.getOk = !!readBack && readBack.value === payload.value;
    out.value = readBack ? readBack.value : null;
  } catch (err) {
    out.error = String((err && err.name) || "") + ": " + String((err && err.message) || err);
  } finally {
    if (db) { try { db.close(); } catch (err) { /* ignore */ } }
  }
  const ok = out.openOk && out.putOk && out.getOk;
  show("#capability-result", out, ok);
  return out;
}

async function testLocalStorage() {
  const out = { available: false };
  try {
    const key = "figureplay-smoke";
    const value = "v-" + Date.now();
    localStorage.setItem(key, value);
    out.available = true;
    out.readMatch = localStorage.getItem(key) === value;
    out.length = localStorage.length;
    localStorage.removeItem(key);
  } catch (err) {
    out.error = String((err && err.name) || "") + ": " + String((err && err.message) || err);
  }
  show("#capability-result", out, out.available);
  return out;
}

async function testFetch(url) {
  const target = url || "../samples/manifest.json";
  const out = { url: target, locationProtocol: location.protocol };
  try {
    const response = await fetch(target);
    out.ok = response.ok;
    out.status = response.status;
    out.textLength = (await response.text()).length;
  } catch (err) {
    out.ok = false;
    out.error = String((err && err.name) || "") + ": " + String((err && err.message) || err);
  }
  show("#capability-result", out, false);
  return out;
}

async function testLocalImage(url) {
  const target = url || "../samples/sample-1.png";
  const out = { url: target, locationProtocol: location.protocol };
  try {
    const img = await loadImage(target);
    out.decoded = true;
    out.naturalWidth = img.naturalWidth;
    out.naturalHeight = img.naturalHeight;
    // file:// 图片直接画进 canvas 后读像素：默认配置下可能因跨源被污染
    try {
      const canvas = document.createElement("canvas");
      canvas.width = 8;
      canvas.height = 8;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, 8, 8);
      out.canvasFirstPixel = Array.from(ctx.getImageData(0, 0, 1, 1).data);
      out.canvasReadable = true;
    } catch (canvasErr) {
      out.canvasReadable = false;
      out.canvasError = String((canvasErr && canvasErr.name) || "") + ": " + String((canvasErr && canvasErr.message) || canvasErr);
    }
  } catch (err) {
    out.decoded = false;
    out.error = String((err && err.name) || "") + ": " + String((err && err.message) || err);
  }
  const ok = out.decoded === true && out.canvasReadable === true;
  show("#capability-result", out, ok);
  return out;
}

function envInfo() {
  const ua = navigator.userAgent;
  const chromeMatch = ua.match(/Chrome\/(\d+\.\d+\.\d+\.\d+)/);
  return {
    userAgent: ua,
    chromeVersion: chromeMatch ? chromeMatch[1] : "unknown",
    locationHref: location.href,
    origin: location.origin,
    protocol: location.protocol,
    isSecureContext: window.isSecureContext,
    crossOriginIsolated: window.crossOriginIsolated,
    hasFileReader: typeof FileReader !== "undefined",
    hasIndexedDB: typeof indexedDB !== "undefined" && indexedDB !== null,
    hasLocalStorage: typeof localStorage !== "undefined",
    hasCanvasToBlob: typeof HTMLCanvasElement.prototype.toBlob === "function",
    hasCryptoSubtle: !!(window.crypto && window.crypto.subtle),
    devicePixelRatio: window.devicePixelRatio,
    screen: { width: screen.width, height: screen.height },
  };
}

// ---------- 自动挂载 UI ----------
$("#btn-process").addEventListener("click", () => { processInputFiles(); });
$("#btn-clear").addEventListener("click", () => {
  state.latestProcessed = null;
  show("#file-result", "（尚未处理文件）");
  setStatus("已清空", null);
});
$("#btn-download-png").addEventListener("click", () => { downloadPng(); });
$("#btn-download-text").addEventListener("click", () => { downloadText(); });
$("#btn-idb").addEventListener("click", () => { testIndexedDB(); });
$("#btn-storage").addEventListener("click", () => { testLocalStorage(); });
$("#btn-fetch").addEventListener("click", () => { testFetch(); });
$("#btn-image").addEventListener("click", () => { testLocalImage(); });

const dropZone = $("#drop-zone");
dropZone.addEventListener("dragover", (event) => {
  event.preventDefault();
  dropZone.classList.add("hover");
});
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("hover"));
dropZone.addEventListener("drop", (event) => {
  event.preventDefault();
  dropZone.classList.remove("hover");
  const dataTransfer = event.dataTransfer;
  if (!dataTransfer || !dataTransfer.files || dataTransfer.files.length === 0) {
    setStatus("drop 事件没有文件", false);
    return;
  }
  const input = $("#file-input");
  input.files = dataTransfer.files;
  processInputFiles();
});

$("#env-info").textContent = stringify(envInfo());

window.smoke = {
  state,
  envInfo,
  processInputFiles,
  processOneFile,
  downloadPng,
  downloadText,
  testIndexedDB,
  testLocalStorage,
  testFetch,
  testLocalImage,
  readFileAsDataURL,
  readFileAsText,
  loadImage,
};

setStatus("smoke harness ready", true);
</script>
</body>
</html>
