name: JavaScript syntax check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check all JavaScript files
        run: |
          set -e
          find js -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "checking $file"
            node --check "$file"
          done
